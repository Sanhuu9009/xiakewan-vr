    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function unlock(password) {
    var data = b64ToBytes(PAYLOAD);
    var salt = data.slice(0, 16), iv = data.slice(16, 28), ct = data.slice(28);
    var subtle = crypto.subtle;
    var base = await subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    var key = await subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 210000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var buf = await subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    return new TextDecoder().decode(buf);
  }
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = '验证中…';
    try {
      var html = await unlock(input.value.trim());
      frame.srcdoc = html;
      frame.hidden = false;
      gate.hidden = true;
    } catch (ex) {
      err.textContent = '密码不正确，或当前浏览器不支持解密。';
      btn.disabled = false;
      btn.textContent = '进入';
      input.select();
    }
  });
})();
</script>
